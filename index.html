
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:24px 20px;background:#191f2b;border-bottom:1px solid #303747}
h1{margin:0;color:#d9b77c;letter-spacing:2px;font-size:27px}
small,.muted{color:#a7adba}
main{padding:20px 20px 110px;max-width:850px;margin:auto}
h2,h3{color:#e3c18a}
h2{font-size:21px}
h3{font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.panel{background:#1d2533;border:1px solid #30394a;border-radius:15px;padding:17px}
.card{cursor:pointer;min-height:110px}
.card b{display:block;margin:12px 0 5px;color:#e3c18a}
.card span{font-size:12px;color:#abb4c4}
.panel{margin-top:15px}
button{background:#c6a56d;color:#111827;border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}
input,textarea,select{width:100%;background:#101722;border:1px solid #475064;color:white;padding:12px;border-radius:9px;margin:7px 0;font:inherit}
textarea{min-height:100px}
label{display:block;margin-top:10px;color:#cbd2dd;font-size:13px}
.item{border-bottom:1px solid #394253;padding:14px 0;overflow-wrap:anywhere}
.item:last-child{border:0}
.item b{color:#e3c18a}
.item p{white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{padding:9px 12px}
.secondary,.back{background:#313a4c;color:white}
.danger{background:#693b42;color:white}
.hidden{display:none!important}
.subpanel{background:#151d2a;border:1px solid #394253;border-radius:12px;padding:12px;margin:12px 0}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:#1d2533;padding:15px;border-radius:12px;text-align:center}
.stat strong{display:block;color:#d9b77c;font-size:25px}
nav{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;background:#191f2b;border-top:1px solid #303747;padding:12px;z-index:10}
nav button{background:transparent;color:#d9b77c;font-size:13px;padding:8px}

</style>
</head>
<body>
<header>
<h1>ZERO</h1>
<small>O teu centro de controlo pessoal · v3.1</small>
</header>
<main>
<section id="home">
<h2>O meu espaço</h2>
<div class="grid">
<div class="card" onclick="show('agenda')">📅<b>Agenda</b><span>Tarefas e compromissos</span></div>
<div class="card" onclick="show('alunos')">👥<b>Alunos</b><span>Fichas e planos</span></div>
<div class="card" onclick="show('treinos')">🥊<b>Treinos</b><span>Modelos reutilizáveis</span></div>
<div class="card" onclick="show('nutricao')">🥗<b>Nutrição</b><span>Modelos alimentares</span></div>
<div class="card" onclick="show('notas')">📝<b>Notas</b><span>Ideias e organização</span></div>
<div class="card" onclick="show('definicoes')">⚙️<b>Definições</b><span>Cópias de segurança</span></div>
</div>
<div class="stats">
<div class="stat"><strong id="totalAlunos">0</strong><small>Alunos</small></div>
<div class="stat"><strong id="totalAgenda">0</strong><small>Compromissos</small></div>
</div>
</section>
<section id="editor" class="hidden">
<button class="back" onclick="show('home')">← Voltar</button>
<h2 id="sectionTitle"></h2>
<div id="formArea" class="panel"></div>
<div id="items" class="panel"></div>
</section>
</main>
<nav>
<button onclick="show('home')">⌂ Início</button>
<button onclick="show('agenda')">▦ Agenda</button>
<button onclick="show('alunos')">♙ Alunos</button>
<button onclick="show('notas')">✎ Notas</button>
</nav>
<script>
"use strict";
const $=id=>document.getElementById(id);
const names={
agenda:"Agenda",alunos:"Alunos",
treinos:"Modelos de treino",
nutricao:"Modelos alimentares",
notas:"Notas",assistente:"Assistente IA",
definicoes:"Definições"
};
const keys=["agenda","alunos","treinos","nutricao","notas","modelosTreino","modelosAlimentares"];
let current="home";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

function getData(k){
try{
let d=JSON.parse(localStorage.getItem("life2000_"+k));
return Array.isArray(d)?d:[];
}catch{return []}
}
function saveData(k,v){
try{
localStorage.setItem("life2000_"+k,JSON.stringify(v));
return true;
}catch(e){
alert("Erro ao guardar os dados.");
return false;
}
}
function el(tag,text){
let e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
return e;
}
function btn(p,t,fn,cls=""){
let b=el("button",t);
b.className=cls;b.onclick=fn;p.appendChild(b);
return b;
}
function field(p,label,value="",type="text"){
p.appendChild(el("label",label));
let e=el("input");
e.type=type;e.value=value??"";
p.appendChild(e);return e;
}
function memo(p,label,value=""){
p.appendChild(el("label",label));
let e=el("textarea");e.value=value??"";
p.appendChild(e);return e;
}
function actions(p){
let a=el("div");a.className="actions";
p.appendChild(a);return a;
}
function clear(){
$("formArea").replaceChildren();
$("items").replaceChildren();
}
function stats(){
$("totalAlunos").textContent=getData("alunos").length;
$("totalAgenda").textContent=getData("agenda").length;
}
function show(k){
current=k;
$("home").classList.toggle("hidden",k!=="home");
$("editor").classList.toggle("hidden",k==="home");
stats();
if(k==="home")return;
$("sectionTitle").textContent=names[k];
clear();
if(k==="alunos")students();
else if(k==="treinos")models("modelosTreino");
else if(k==="nutricao")models("modelosAlimentares");
else if(k==="definicoes")settings();
else if(k==="assistente")
$("formArea").textContent="Assistente de voz e inteligência artificial em preparação.";
else generic();
}

function generic(index=null){
clear();
let a=$("formArea"),d=getData(current);
let x=index===null?{}:d[index]||{};
let title=field(a,"Título",x.title||"");
let date=current==="agenda"?field(a,"Data e hora",x.date||"","datetime-local"):null;
let detail=memo(a,"Conteúdo",x.detail||"");
btn(a,"Guardar",()=>{
if(!title.value.trim())return alert("Preenche o título.");
let all=getData(current);
let obj={title:title.value.trim(),date:date?.value||"",detail:detail.value.trim()};
if(index===null)all.unshift(obj);
else all[index]=obj;
if(saveData(current,all)){generic();stats()}
});
let list=$("items");
if(!d.length)list.textContent="Ainda não existem registos.";
d.forEach((x,i)=>{
let box=el("div");box.className="item";
box.appendChild(el("b",x.title));
if(x.date)box.appendChild(el("p",x.date.replace("T"," ")));
if(x.detail)box.appendChild(el("p",x.detail));
let ac=actions(box);
btn(ac,"Editar",()=>generic(i),"secondary");
btn(ac,"Eliminar",()=>{
if(!confirm("Eliminar registo?"))return;
let all=getData(current);all.splice(i,1);
if(saveData(current,all))generic();
},"danger");
list.appendChild(box);
});
}

function students(){
clear();
let a=$("formArea");
btn(a,"+ Novo aluno",()=>studentForm());
let search=field(a,"Pesquisar aluno");
search.oninput=()=>renderStudents(search.value);
renderStudents();
}
function renderStudents(q=""){
let a=$("items");a.replaceChildren();
let d=getData("alunos").filter(x=>
String(x.nome||"").toLowerCase().includes(q.toLowerCase()));
if(!d.length)a.textContent="Nenhum aluno encontrado.";
d.forEach(x=>{
let box=el("div");box.className="item";
box.appendChild(el("b",x.nome));
box.appendChild(el("p",[
x.idade?x.idade+" anos":"",
x.peso?x.peso+" kg":"",
x.objetivo||""
].filter(Boolean).join(" · ")));
btn(box,"Abrir ficha",()=>profile(x.id));
a.appendChild(box);
});
}
function studentForm(id=null){
clear();
let a=$("formArea");
let x=getData("alunos").find(z=>z.id===id)||{};
a.appendChild(el("h3",id?"Editar aluno":"Novo aluno"));
let f={};
[
["nome","Nome","text"],
["idade","Idade","number"],
["altura","Altura (cm)","number"],
["peso","Peso (kg)","number"],
["objetivo","Objetivo","text"]
].forEach(([k,l,t])=>f[k]=field(a,l,x[k]||"",t));
let obs=memo(a,"Observações",x.obs||"");
let ac=actions(a);
btn(ac,"Guardar ficha",()=>{
let v={};
Object.keys(f).forEach(k=>v[k]=f[k].value.trim());
v.obs=obs.value.trim();
if(!v.nome)return alert("Preenche o nome.");
let d=getData("alunos"),newId=id||uid();
if(id){
let i=d.findIndex(z=>z.id===id);
if(i<0)return;
d[i]={...d[i],...v};
}else{
d.unshift({...v,id:newId,planosTreino:[],planosAlimentares:[]});
}
if(saveData("alunos",d)){profile(newId);stats()}
});
btn(ac,"Cancelar",()=>id?profile(id):students(),"secondary");
}
function profile(id){
clear();
let x=getData("alunos").find(z=>z.id===id);
if(!x)return students();
let a=$("formArea");
btn(a,"← Lista de alunos",students,"secondary");
a.appendChild(el("h2",x.nome));
[
["Idade",x.idade?x.idade+" anos":"—"],
["Altura",x.altura?x.altura+" cm":"—"],
["Peso",x.peso?x.peso+" kg":"—"],
["Objetivo",x.objetivo||"—"],
["Observações",x.obs||"—"]
].forEach(([k,v])=>{
let p=el("p");
p.appendChild(el("b",k+": "));
p.appendChild(document.createTextNode(v));
a.appendChild(p);
});
let ac=actions(a);
btn(ac,"Editar ficha",()=>studentForm(id),"secondary");
btn(ac,"Eliminar aluno",()=>{
if(!confirm("Eliminar aluno e todos os planos?"))return;
let d=getData("alunos").filter(z=>z.id!==id);
if(saveData("alunos",d)){students();stats()}
},"danger");
let list=$("items");
["planosTreino","planosAlimentares"].forEach(type=>{
let box=el("div");
box.appendChild(el("h3",type==="planosTreino"?"🥊 Planos de treino":"🥗 Planos alimentares"));
btn(box,"+ Criar plano",()=>planForm(id,type));
(x[type]||[]).forEach(p=>{
let item=el("div");item.className="item";
item.appendChild(el("b",p.titulo||"Plano"));
if(p.estruturado&&Array.isArray(p.blocos)){
p.blocos.forEach(b=>{
item.appendChild(el("p",b.nome||""));
(b.itens||[]).forEach(z=>item.appendChild(el("p",Object.values(z).filter(Boolean).join(" · "))));
});
}else item.appendChild(el("p",p.conteudo||""));
let aa=actions(item);
btn(aa,"Editar",()=>planForm(id,type,p.id),"secondary");
btn(aa,"Duplicar",()=>{
let d=getData("alunos"),s=d.find(z=>z.id===id);
let original=s[type].find(z=>z.id===p.id);
s[type].push({...JSON.parse(JSON.stringify(original)),id:uid(),titulo:original.titulo+" (cópia)"});
if(saveData("alunos",d))profile(id);
},"secondary");
btn(aa,"Eliminar",()=>{
if(!confirm("Eliminar plano?"))return;
let d=getData("alunos"),s=d.find(z=>z.id===id);
s[type]=s[type].filter(z=>z.id!==p.id);
if(saveData("alunos",d))profile(id);
},"danger");
item.appendChild(aa);box.appendChild(item);
});
list.appendChild(box);
});
}

function planForm(id,type,pid=null,template=null){
clear();
let student=getData("alunos").find(z=>z.id===id);
if(!student)return students();
let p=template||(student[type]||[]).find(z=>z.id===pid)||{};
let a=$("formArea");
a.appendChild(el("h3",pid?"Editar plano":"Novo plano"));
let title=field(a,"Nome do plano",p.titulo||"");
let mode=el("select");
[["structured","Estruturado"],["text","Texto livre"]].forEach(([v,t])=>{
let o=el("option",t);o.value=v;mode.appendChild(o);
});
mode.value=!p.estruturado&&p.conteudo?"text":"structured";
a.appendChild(el("label","Formato"));
a.appendChild(mode);
let textBox=el("div"),structured=el("div");
a.append(textBox,structured);
let content=memo(textBox,"Conteúdo",p.conteudo||"");
let blocks=Array.isArray(p.blocos)?JSON.parse(JSON.stringify(p.blocos)):[];
if(!blocks.length)blocks=[{nome:type==="planosTreino"?"Treino A":"Pequeno-almoço",itens:[]}];
let views=[];
function sync(){
views.forEach((v,i)=>{
if(!blocks[i])return;
blocks[i].nome=v.name.value.trim();
blocks[i].itens=v.items.map(f=>Object.fromEntries(
Object.entries(f).map(([k,e])=>[k,e.value.trim()])
));
});
}
function render(){
structured.replaceChildren();views=[];
blocks.forEach((b,bi)=>{
let box=el("div");box.className="subpanel";
let name=field(box,type==="planosTreino"?"Sessão / bloco":"Refeição",b.nome||"");
let items=[];
(b.itens||[]).forEach((z,zi)=>{
let sub=el("div");
sub.className="subpanel";
const f={};
let fields=type==="planosTreino"?
[["nome","Exercício"],["series","Séries"],["reps","Repetições / duração"],["carga","Carga"],["descanso","Descanso"],["obs","Observações"]]:
[["nome","Alimento"],["quantidade","Quantidade"],["calorias","Calorias"],["obs","Observações"]];
fields.forEach(([k,l])=>f[k]=field(sub,l,z[k]||""));
btn(sub,"Remover item",()=>{
if(!confirm("Remover este item?"))return;
sync();blocks[bi].itens.splice(zi,1);render();
},"danger");
box.appendChild(sub);items.push(f);
});
btn(box,type==="planosTreino"?"+ Exercício":"+ Alimento",()=>{
sync();blocks[bi].itens.push({});render();
});
btn(box,"Remover bloco",()=>{
if(!confirm("Remover este bloco?"))return;
sync();blocks.splice(bi,1);render();
},"danger");
structured.appendChild(box);
views.push({name,items});
});
}
render();
function toggle(){
textBox.classList.toggle("hidden",mode.value!=="text");
structured.classList.toggle("hidden",mode.value!=="structured");
addBlockBtn.classList.toggle("hidden",mode.value!=="structured");
}
mode.onchange=toggle;
let ac=actions(a);
let addBlockBtn=btn(ac,"+ Bloco / refeição",()=>{
sync();blocks.push({nome:"",itens:[]});render();
});
toggle();
let key=type==="planosTreino"?"modelosTreino":"modelosAlimentares";
let templates=getData(key);
if(!pid&&templates.length){
let choice=el("select");
choice.appendChild(el("option","Selecionar modelo"));
templates.forEach(m=>{
let o=el("option",m.titulo);o.value=m.id;choice.appendChild(o);
});
a.appendChild(el("label","Usar modelo"));
a.appendChild(choice);
btn(a,"Aplicar modelo",()=>{
let m=templates.find(z=>z.id===choice.value);
if(m&&confirm("Substituir o conteúdo atual?"))planForm(id,type,null,m);
},"secondary");
}
btn(ac,"Guardar plano",()=>{
if(!title.value.trim())return alert("Preenche o nome.");
sync();
let obj={
id:pid||uid(),titulo:title.value.trim(),
conteudo:mode.value==="text"?content.value.trim():"",
estruturado:mode.value==="structured",
blocos:mode.value==="structured"?blocks:[]
};
let d=getData("alunos"),s=d.find(z=>z.id===id);
if(!s)return;
s[type]=s[type]||[];
let i=s[type].findIndex(z=>z.id===pid);
if(i>=0)s[type][i]={...s[type][i],...obj};
else s[type].push(obj);
if(saveData("alunos",d))profile(id);
});
btn(ac,"Cancelar",()=>profile(id),"secondary");
}

function models(key){
clear();
let a=$("formArea"),list=$("items");
a.appendChild(el("p","Cria modelos reutilizáveis para os teus alunos."));
btn(a,"+ Novo modelo",()=>modelForm(key));
let d=getData(key);
if(!d.length)list.textContent="Ainda não existem modelos.";
d.forEach(m=>{
let box=el("div");box.className="item";
box.appendChild(el("b",m.titulo));
box.appendChild(el("p",m.conteudo||(m.blocos||[]).map(b=>b.nome).join(" · ")));
let ac=actions(box);
btn(ac,"Editar",()=>modelForm(key,m.id),"secondary");
btn(ac,"Duplicar",()=>{
let all=getData(key);
all.push({...JSON.parse(JSON.stringify(m)),id:uid(),titulo:m.titulo+" (cópia)"});
if(saveData(key,all))models(key);
},"secondary");
btn(ac,"Eliminar",()=>{
if(!confirm("Eliminar modelo?"))return;
if(saveData(key,getData(key).filter(z=>z.id!==m.id)))models(key);
},"danger");
list.appendChild(box);
});
}
function modelForm(key,id=null){
clear();
let d=getData(key),m=d.find(z=>z.id===id)||{},a=$("formArea");
a.appendChild(el("h3",id?"Editar modelo":"Novo modelo"));
let title=field(a,"Nome do modelo",m.titulo||"");
let desc=memo(a,"Descrição",m.conteudo||"");
let blocks=Array.isArray(m.blocos)?JSON.parse(JSON.stringify(m.blocos)):[];
let list=el("div");a.appendChild(list);
let views=[];
function sync(){
views.forEach((v,i)=>{
if(!blocks[i])return;
blocks[i].nome=v.name.value.trim();
blocks[i].itens=v.items.map(f=>Object.fromEntries(
Object.entries(f).map(([k,e])=>[k,e.value.trim()])
));
});
}
function render(){
list.replaceChildren();views=[];
blocks.forEach((b,bi)=>{
let box=el("div");box.className="subpanel";
let name=field(box,key==="modelosTreino"?"Sessão / bloco":"Refeição",b.nome||"");
let items=[];
(b.itens||[]).forEach((z,zi)=>{
let sub=el("div");
sub.className="subpanel";
const f={};
let fields=key==="modelosTreino"?
[["nome","Exercício"],["series","Séries"],["reps","Repetições"],["carga","Carga"],["descanso","Descanso"],["obs","Observações"]]:
[["nome","Alimento"],["quantidade","Quantidade"],["calorias","Calorias"],["obs","Observações"]];
fields.forEach(([k,l])=>f[k]=field(sub,l,z[k]||""));
btn(sub,"Remover item",()=>{
if(!confirm("Remover este item?"))return;
sync();blocks[bi].itens.splice(zi,1);render();
},"danger");
box.appendChild(sub);items.push(f);
});
btn(box,"+ Item",()=>{
sync();blocks[bi].itens.push({});render();
});
btn(box,"Remover bloco",()=>{
if(!confirm("Remover este bloco?"))return;
sync();blocks.splice(bi,1);render();
},"danger");
list.appendChild(box);views.push({name,items});
});
}
render();
let ac=actions(a);
btn(ac,"+ Bloco / refeição",()=>{
sync();blocks.push({nome:"",itens:[]});render();
});
btn(ac,"Guardar modelo",()=>{
if(!title.value.trim())return alert("Preenche o nome.");
sync();
let all=getData(key);
let obj={id:id||uid(),titulo:title.value.trim(),conteudo:desc.value.trim(),blocos,estruturado:blocks.length>0};
let i=all.findIndex(z=>z.id===id);
if(i>=0)all[i]=obj;else all.push(obj);
if(saveData(key,all))models(key);
});
btn(ac,"Cancelar",()=>models(key),"secondary");
}

function settings(){
clear();
let a=$("formArea");
a.appendChild(el("h3","Cópia de segurança"));
a.appendChild(el("p","Os dados são guardados neste navegador. Não existe sincronização automática."));
btn(a,"Exportar cópia JSON",()=>{
let data={app:"LIFE 2000",version:3,exportedAt:new Date().toISOString(),data:{}};
keys.forEach(k=>data.data[k]=getData(k));
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let url=URL.createObjectURL(blob),link=el("a");
link.href=url;
link.download="life2000-backup.json";
document.body.appendChild(link);
link.click();link.remove();
setTimeout(()=>URL.revokeObjectURL(url),3000);
});
let file=field(a,"Importar cópia JSON","","file");
file.accept=".json,application/json";

/* LIFE 2000 v4.0 — PLANOS ALIMENTARES */
(function () {
"use strict";

const originalPlanForm = planForm;
const originalModelForm = modelForm;
const originalProfile = profile;

const foodFields = [
  ["nome", "Alimento", "text"],
  ["quantidade", "Quantidade (ex.: 150 g)", "text"],
  ["calorias", "Calorias (kcal)", "number"],
  ["proteinas", "Proteínas (g)", "number"],
  ["hidratos", "Hidratos (g)", "number"],
  ["gorduras", "Gorduras (g)", "number"],
  ["obs", "Observações", "text"]
];

const mealsDefault = [
  "Pequeno-almoço",
  "Meio da manhã",
  "Almoço",
  "Lanche",
  "Jantar",
  "Ceia"
];

function numberValue(v) {
  const n = Number(String(v ?? "0").replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function totals(blocks) {
  const result = {
    calorias: 0,
    proteinas: 0,
    hidratos: 0,
    gorduras: 0
  };
  (blocks || []).forEach(b => {
    (b.itens || []).forEach(item => {
      Object.keys(result).forEach(k => {
        result[k] += numberValue(item[k]);
      });
    });
  });
  return result;
}

function totalText(t) {
  const fmt = n => Math.round(n * 10) / 10;
  return (
    fmt(t.calorias) + " kcal · " +
    fmt(t.proteinas) + " g proteína · " +
    fmt(t.hidratos) + " g hidratos · " +
    fmt(t.gorduras) + " g gordura"
  );
}

function nutritionEditor(studentId = null, planId = null, model = null) {
  clear();

  const isTemplate = studentId === null;
  const key = isTemplate ? "modelosAlimentares" : "alunos";
  const all = getData(key);
  const student = isTemplate ? null : all.find(s => s.id === studentId);

  if (!isTemplate && !student) {
    students();
    return;
  }

  const collection = isTemplate
    ? all
    : (student.planosAlimentares || []);

  const existing = model ||
    collection.find(p => p.id === planId) || {};

  const a = $("formArea");
  const list = $("items");

  a.appendChild(el("h3",
    planId ? "Editar plano alimentar" :
    isTemplate ? "Novo modelo alimentar" :
    "Novo plano alimentar"
  ));

  const title = field(a, "Nome do plano", existing.titulo || "");
  const description = memo(a, "Descrição / orientações",
    existing.conteudo || "");

  let blocks = Array.isArray(existing.blocos)
    ? JSON.parse(JSON.stringify(existing.blocos))
    : [];

  if (!blocks.length) {
    blocks = mealsDefault.map(nome => ({
      nome,
      itens: []
    }));
  }

  const workspace = el("div");
  a.appendChild(workspace);

  const summary = el("div");
  summary.className = "subpanel";
  list.appendChild(summary);

  let views = [];

  function sync() {
    views.forEach((v, i) => {
      if (!blocks[i]) return;
      blocks[i].nome = v.name.value.trim();
      blocks[i].itens = v.items.map(fields => {
        const item = {};
        Object.entries(fields).forEach(([k, input]) => {
          item[k] = input.value.trim();
        });
        return item;
      });
    });
  }

  function updateSummary() {
    sync();
    summary.replaceChildren();
    summary.appendChild(el("h3", "Totais diários"));
    summary.appendChild(el("p", totalText(totals(blocks))));
    summary.appendChild(el("small",
      "Os totais incluem apenas os valores nutricionais preenchidos."
    ));
  }

  function render() {
    workspace.replaceChildren();
    views = [];

    blocks.forEach((meal, mi) => {
      const box = el("div");
      box.className = "subpanel";

      const name = field(box, "Refeição", meal.nome || "");
      const items = [];

      (meal.itens || []).forEach((food, fi) => {
        const sub = el("div");
        sub.className = "subpanel";

        const inputs = {};

        foodFields.forEach(([k, label, type]) => {
          inputs[k] = field(sub, label, food[k] ?? "", type);
          if (type === "number") {
            inputs[k].min = "0";
            inputs[k].step = "any";
            inputs[k].oninput = updateSummary;
          }
        });

        btn(sub, "Remover alimento", () => {
          if (!confirm("Remover este alimento?")) return;
          sync();
          blocks[mi].itens.splice(fi, 1);
          render();
        }, "danger");

        box.appendChild(sub);
        items.push(inputs);
      });

      btn(box, "+ Adicionar alimento", () => {
        sync();
        blocks[mi].itens.push({});
        render();
      });

      btn(box, "Remover refeição", () => {
        if (!confirm("Remover esta refeição?")) return;
        sync();
        blocks.splice(mi, 1);
        render();
      }, "danger");

      workspace.appendChild(box);
      views.push({name, items});
    });

    updateSummary();
  }

  render();

  const controls = actions(a);

  btn(controls, "+ Refeição", () => {
    sync();
    blocks.push({nome: "", itens: []});
    render();
  });

  if (!isTemplate && !planId && !model) {
    const templates = getData("modelosAlimentares");

    if (templates.length) {
      const select = el("select");
      select.appendChild(el("option", "Selecionar modelo"));

      templates.forEach(m => {
        const option = el("option", m.titulo);
        option.value = m.id;
        select.appendChild(option);
      });

      a.appendChild(el("label", "Aplicar modelo alimentar"));
      a.appendChild(select);

      btn(a, "Aplicar modelo", () => {
        const selected = templates.find(m => m.id === select.value);
        if (selected && confirm("Substituir o plano atual pelo modelo?")) {
          nutritionEditor(studentId, null, selected);
        }
      }, "secondary");
    }
  }

  btn(controls, "Guardar plano", () => {
    sync();

    if (!title.value.trim()) {
      alert("Preenche o nome do plano.");
      return;
    }

    const invalid = blocks.some(b =>
      (b.itens || []).some(item =>
        ["calorias", "proteinas", "hidratos", "gorduras"].some(k =>
          item[k] !== "" &&
          (!Number.isFinite(Number(String(item[k]).replace(",", "."))) ||
           numberValue(item[k]) < 0)
        )
      )
    );

    if (invalid) {
      alert("Verifica os valores nutricionais.");
      return;
    }

    const obj = {
      id: planId || uid(),
      titulo: title.value.trim(),
      conteudo: description.value.trim(),
      estruturado: true,
      blocos: blocks
    };

    if (isTemplate) {
      const data = getData("modelosAlimentares");
      const index = data.findIndex(p => p.id === planId);
      if (index >= 0) data[index] = {...data[index], ...obj};
      else data.push(obj);

      if (saveData("modelosAlimentares", data)) {
        models("modelosAlimentares");
      }
    } else {
      const data = getData("alunos");
      const s = data.find(x => x.id === studentId);
      if (!s) return;

      s.planosAlimentares = s.planosAlimentares || [];
      const index = s.planosAlimentares.findIndex(p => p.id === planId);

      if (index >= 0) {
        s.planosAlimentares[index] = {
          ...s.planosAlimentares[index],
          ...obj
        };
      } else {
        s.planosAlimentares.push(obj);
      }

      if (saveData("alunos", data)) profile(studentId);
    }
  });

  btn(controls, "Cancelar", () => {
    if (isTemplate) models("modelosAlimentares");
    else profile(studentId);
  }, "secondary");
}

/* Integração com as funções existentes */

planForm = function(id, type, pid = null, template = null) {
  if (type === "planosAlimentares") {
    nutritionEditor(id, pid, template);
  } else {
    originalPlanForm(id, type, pid, template);
  }
};

modelForm = function(key, id = null) {
  if (key === "modelosAlimentares") {
    nutritionEditor(null, id);
  } else {
    originalModelForm(key, id);
  }
};

profile = function(id) {
  originalProfile(id);

  const student = getData("alunos").find(s => s.id === id);
  if (!student) return;

  const plans = student.planosAlimentares || [];
  if (!plans.length) return;

  const box = el("div");
  box.className = "panel";
  box.appendChild(el("h3", "Resumo nutricional dos planos"));

  plans.forEach(p => {
    if (!p.estruturado || !Array.isArray(p.blocos)) return;

    const item = el("div");
    item.className = "item";
    item.appendChild(el("b", p.titulo || "Plano alimentar"));
    item.appendChild(el("p", totalText(totals(p.blocos))));
    box.appendChild(item);
  });

  $("items").appendChild(box);
};

const subtitle = document.querySelector("header small");
if (subtitle) {
  subtitle.textContent = "O teu centro de controlo pessoal · v4.0";
}

})();
  
/* LIFE 2000 v4.1 — VISUALIZAÇÃO DOS PLANOS */
(function () {
"use strict";

const previousProfile = profile;

function addValue(parent, label, value) {
  if (value === undefined || value === null ||
      String(value).trim() === "") return;

  const line = el("div");
  line.style.margin = "5px 0";
  line.style.fontSize = "14px";

  const heading = el("strong", label + ": ");
  heading.style.color = "#e3c18a";

  line.appendChild(heading);
  line.appendChild(document.createTextNode(String(value)));
  parent.appendChild(line);
}

function displayPlan(plan, type) {
  const box = el("div");
  box.className = "subpanel";
  box.style.marginTop = "12px";

  box.appendChild(el("h3", plan.titulo || "Plano"));

  if (!plan.estruturado || !Array.isArray(plan.blocos)) {
    const p = el("p", plan.conteudo || "Sem conteúdo.");
    box.appendChild(p);
    return box;
  }

  plan.blocos.forEach(block => {
    const section = el("div");
    section.className = "subpanel";

    const heading = el("h3", block.nome || "Bloco");
    section.appendChild(heading);

    (block.itens || []).forEach(item => {
      const food = el("div");
      food.className = "item";

      food.appendChild(el("b", item.nome || "Item"));

      if (type === "planosAlimentares") {
        addValue(food, "Quantidade", item.quantidade);
        addValue(food, "Calorias", item.calorias !== "" &&
          item.calorias != null ? item.calorias + " kcal" : "");
        addValue(food, "Proteínas", item.proteinas !== "" &&
          item.proteinas != null ? item.proteinas + " g" : "");
        addValue(food, "Hidratos", item.hidratos !== "" &&
          item.hidratos != null ? item.hidratos + " g" : "");
        addValue(food, "Gorduras", item.gorduras !== "" &&
          item.gorduras != null ? item.gorduras + " g" : "");
      } else {
        addValue(food, "Séries", item.series);
        addValue(food, "Repetições / duração", item.reps);
        addValue(food, "Carga", item.carga);
        addValue(food, "Descanso", item.descanso);
      }

      addValue(food, "Observações", item.obs);
      section.appendChild(food);
    });

    box.appendChild(section);
  });

  return box;
}

profile = function (id) {
  previousProfile(id);

  const student = getData("alunos").find(s => s.id === id);
  if (!student) return;

  const root = $("items");
  const sections = [
    ["planosTreino", "🥊 Planos de treino"],
    ["planosAlimentares", "🥗 Planos alimentares"]
  ];

  sections.forEach(([type, heading]) => {
    const plans = student[type] || [];
    if (!plans.length) return;

    const container = el("div");
    container.className = "panel";

    container.appendChild(el("h3", heading + " — Vista detalhada"));

    plans.forEach(plan => {
      container.appendChild(displayPlan(plan, type));
    });

    root.appendChild(container);
  });
};

const subtitle = document.querySelector("header small");
if (subtitle) {
  subtitle.textContent = "O teu centro de controlo pessoal · v4.1";
}

})();

(function () {
"use strict";

function info(parent, label, value, unit = "") {
  if (value === undefined || value === null ||
      String(value).trim() === "") return;

  const line = el("div");
  line.style.margin = "5px 0";
  line.style.fontSize = "14px";

  const name = el("strong", label + ": ");
  name.style.color = "#e3c18a";

  line.appendChild(name);
  line.appendChild(document.createTextNode(
    String(value) + unit
  ));
  parent.appendChild(line);
}

function num(value) {
  const n = Number(String(value ?? "0").replace(",", "."));
  return Number.isFinite(n) ? n : 0;
}

function nutritionTotals(blocks) {
  const result = {
    calorias: 0,
    proteinas: 0,
    hidratos: 0,
    gorduras: 0
  };

  (blocks || []).forEach(block => {
    (block.itens || []).forEach(item => {
      Object.keys(result).forEach(key => {
        result[key] += num(item[key]);
      });
    });
  });

  return result;
}

function fmt(value) {
  return String(Math.round(value * 10) / 10);
}

function renderPlan(parent, plan, type) {
  const card = el("div");
  card.className = "subpanel";

  const details = el("details");
  details.style.width = "100%";

  const heading = el("summary", plan.titulo || "Plano");
  heading.style.color = "#e3c18a";
  heading.style.fontSize = "18px";
  heading.style.fontWeight = "700";
  heading.style.cursor = "pointer";
  heading.style.padding = "10px 0";

  details.appendChild(heading);

  const content = el("div");
  content.style.padding = "8px 0";

  if (plan.conteudo) {
    const description = el("p", plan.conteudo);
    description.style.whiteSpace = "pre-wrap";
    content.appendChild(description);
  }

  if (plan.estruturado && Array.isArray(plan.blocos)) {
    plan.blocos.forEach(block => {
      const validItems = (block.itens || []).filter(item =>
        item.nome && String(item.nome).trim()
      );

      if (!validItems.length) return;

      const section = el("div");
      section.className = "subpanel";

      section.appendChild(el("h3", block.nome || "Bloco"));

      validItems.forEach(item => {
        const row = el("div");
        row.className = "item";

        row.appendChild(el("b", item.nome));

        if (type === "planosAlimentares") {
          info(row, "Quantidade", item.quantidade);
          info(row, "Calorias", item.calorias, " kcal");
          info(row, "Proteínas", item.proteinas, " g");
          info(row, "Hidratos", item.hidratos, " g");
          info(row, "Gorduras", item.gorduras, " g");
        } else {
          info(row, "Séries", item.series);
          info(row, "Repetições / duração", item.reps);
          info(row, "Carga", item.carga);
          info(row, "Descanso", item.descanso);
        }

        info(row, "Observações", item.obs);
        section.appendChild(row);
      });

      content.appendChild(section);
    });

    if (type === "planosAlimentares") {
      const totals = nutritionTotals(plan.blocos);
      const summary = el("div");
      summary.className = "subpanel";

      summary.appendChild(el("h3", "Total diário"));
      info(summary, "Calorias", fmt(totals.calorias), " kcal");
      info(summary, "Proteínas", fmt(totals.proteinas), " g");
      info(summary, "Hidratos", fmt(totals.hidratos), " g");
      info(summary, "Gorduras", fmt(totals.gorduras), " g");

      summary.appendChild(el("small",
        "Totais dos valores nutricionais preenchidos."
      ));

      content.appendChild(summary);
    }
  }

  details.appendChild(content);
  card.appendChild(details);
  parent.appendChild(card);
}

profile = function(id) {
  clear();

  const student = getData("alunos").find(s => s.id === id);
  if (!student) {
    students();
    return;
  }

  const a = $("formArea");
  const list = $("items");

  btn(a, "← Lista de alunos", students, "secondary");
  a.appendChild(el("h2", student.nome));

  [
    ["Idade", student.idade ? student.idade + " anos" : "—"],
    ["Altura", student.altura ? student.altura + " cm" : "—"],
    ["Peso", student.peso ? student.peso + " kg" : "—"],
    ["Objetivo", student.objetivo || "—"],
    ["Observações", student.obs || "—"]
  ].forEach(([label, value]) => {
    const p = el("p");
    p.appendChild(el("b", label + ": "));
    p.appendChild(document.createTextNode(value));
    a.appendChild(p);
  });

  const studentActions = actions(a);

  btn(studentActions, "Editar ficha",
    () => studentForm(id), "secondary");

  btn(studentActions, "Eliminar aluno", () => {
    if (!confirm("Eliminar aluno e todos os seus planos?")) return;

    const data = getData("alunos").filter(s => s.id !== id);
    if (saveData("alunos", data)) {
      students();
      stats();
    }
  }, "danger");

  [
    ["planosTreino", "🥊 Planos de treino"],
    ["planosAlimentares", "🥗 Planos alimentares"]
  ].forEach(([type, title]) => {
    const section = el("div");
    section.className = "panel";

    section.appendChild(el("h3", title));

    btn(section, "+ Criar plano",
      () => planForm(id, type));

    (student[type] || []).forEach(plan => {
      const wrapper = el("div");
      wrapper.style.marginTop = "14px";

      renderPlan(wrapper, plan, type);

      const ac = actions(wrapper);

      btn(ac, "Editar", () => {
        planForm(id, type, plan.id);
      }, "secondary");

      btn(ac, "Duplicar", () => {
        const data = getData("alunos");
        const s = data.find(x => x.id === id);
        if (!s) return;

        const original = (s[type] || []).find(
          x => x.id === plan.id
        );
        if (!original) return;

        const copy = JSON.parse(JSON.stringify(original));
        copy.id = uid();
        copy.titulo = (copy.titulo || "Plano") + " (cópia)";

        s[type].push(copy);

        if (saveData("alunos", data)) profile(id);
      }, "secondary");

      btn(ac, "Eliminar", () => {
        if (!confirm("Eliminar este plano?")) return;

        const data = getData("alunos");
        const s = data.find(x => x.id === id);
        if (!s) return;

        s[type] = (s[type] || []).filter(
          x => x.id !== plan.id
        );

        if (saveData("alunos", data)) profile(id);
      }, "danger");

      section.appendChild(wrapper);
    });

    list.appendChild(section);
  });
};

/* LIFE 2000 v4.3 — BIBLIOTECA DE ALIMENTOS */
/* PARTE 1 */
(function () {
"use strict";

const foodKey = "bibliotecaAlimentos";

function getFoods() {
  return getData(foodKey);
}

function saveFoods(data) {
  return saveData(foodKey, data);
}

function nutritionNumber(value) {
  const n = Number(String(value ?? "0").replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function nutritionCalculate(food, grams) {
  const factor = nutritionNumber(grams) / 100;
  const result = {};

  ["calorias", "proteinas", "hidratos", "gorduras"]
    .forEach(key => {
      result[key] = Math.round(
        nutritionNumber(food[key]) * factor * 10
      ) / 10;
    });

  return result;
}

function nutritionFormat(value) {
  return String(Math.round(value * 10) / 10);
}

function foodLibrary() {
  clear();

  const form = $("formArea");
  const list = $("items");

  form.appendChild(el("h3", "🥗 Biblioteca de alimentos"));

  btn(form, "+ Novo alimento", () => foodForm());

  const search = field(form, "Pesquisar alimento");

  function render(query = "") {
    list.replaceChildren();

    const foods = getFoods()
      .filter(food => String(food.nome || "")
        .toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => a.nome.localeCompare(b.nome, "pt"));

    if (!foods.length) {
      list.textContent = "Nenhum alimento encontrado.";
      return;
    }

    foods.forEach(food => {
      const box = el("div");
      box.className = "item";

      box.appendChild(el("b", food.nome));
      box.appendChild(el("p", "Valores por 100 g"));

      [
        ["Calorias", "calorias", " kcal"],
        ["Proteínas", "proteinas", " g"],
        ["Hidratos", "hidratos", " g"],
        ["Gorduras", "gorduras", " g"]
      ].forEach(([label, key, unit]) => {
        const p = el("p",
          label + ": " + food[key] + unit
        );
        p.style.margin = "5px 0";
        box.appendChild(p);
      });

      const ac = actions(box);

      btn(ac, "Editar", () => foodForm(food.id),
        "secondary");

      btn(ac, "Eliminar", () => {
        if (!confirm("Eliminar este alimento da biblioteca?"))
          return;

        const data = getFoods()
          .filter(item => item.id !== food.id);

        if (saveFoods(data)) render(search.value);
      }, "danger");

      list.appendChild(box);
    });
  }

  search.oninput = () => render(search.value);
  render();
}

function foodForm(id = null) {
  clear();

  const form = $("formArea");
  const food = getFoods().find(x => x.id === id) || {};

  form.appendChild(el("h3",
    id ? "Editar alimento" : "Novo alimento"
  ));

  const name = field(form, "Nome do alimento",
    food.nome || "");

  form.appendChild(el("p",
    "Introduz os valores nutricionais por 100 g."
  ));

  const inputs = {};

  [
    ["calorias", "Calorias (kcal)"],
    ["proteinas", "Proteínas (g)"],
    ["hidratos", "Hidratos (g)"],
    ["gorduras", "Gorduras (g)"]
  ].forEach(([key, label]) => {
    inputs[key] = field(form, label,
      food[key] ?? "", "number");

    inputs[key].min = "0";
    inputs[key].step = "any";
  });

  const ac = actions(form);

  btn(ac, "Guardar alimento", () => {
    if (!name.value.trim()) {
      alert("Introduz o nome do alimento.");
      return;
    }

    const data = getFoods();

    const obj = {
      id: id || uid(),

  if (food.categoria && food.subcategoria) return food;

  const rules = [
    ["Proteínas", "Carnes",
      /frango|peru|vaca|vitela|porco|coelho|carne/],
    ["Proteínas", "Peixes",
      /salmão|salmao|pescada|bacalhau|atum|dourada|robalo|sardinha|cavala|camarão/],

    ["Hidratos", "Batatas", /batata/],

    ["Legumes", "Legumes e hortícolas",

  ];

  for (const [categoria, subcategoria, regex] of rules) {
    if (regex.test(name)) {

function normalize(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function installFoods() {
  const existing = getData(KEY);
  const known = new Set(existing.map(f => normalize(f.nome)));
  let added = 0;

  alimentos.forEach(row => {
    const [nome,categoria,subcategoria,
      calorias,proteinas,hidratos,gorduras] = row;

    if (known.has(normalize(nome))) return;

    existing.push({
      id: uid(),
      nome,
      categoria,
      subcategoria,
      calorias,
      proteinas,
      hidratos,
      gorduras,
      origem: "LIFE 2000 v4.5",
      referencia: "Valores médios aproximados"
    });

    known.add(normalize(nome));
    added++;
  });

  if (added && !saveData(KEY, existing)) return;

  try {
    localStorage.setItem("life2000_food_version", VERSION);
  } catch(e) {}

  return added;
}

/* LIFE 2000 v4.6.1 — NUTRIÇÃO INTELIGENTE */
(function () {
"use strict";

const area = document.getElementById("formArea");
if (!area) return;

const nutrients = [
  "calorias", "proteinas", "hidratos", "gorduras"
];

function number(v) {
  const n = Number(String(v ?? "").replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function round(v) {
  return Math.round(v * 10) / 10;
}

function mealBoxes() {
  return [...area.querySelectorAll("button")]
    .filter(b => b.textContent.trim() === "+ Adicionar alimento")
    .map(b => b.parentElement);
}

function foodPanels(meal) {
  return [...meal.children].filter(node =>
    node.classList?.contains("subpanel") &&
    !node.classList.contains("life44picker")
  );
}

function foodInputs(panel) {
  return [...panel.querySelectorAll("input")];
}

function findFood(name) {
  const lib = window.lifeFoodLibrary;
  if (!lib) return null;

  return lib.getFoods().find(f =>
    String(f.nome).trim().toLowerCase() ===
    String(name).trim().toLowerCase()
  );
}

function recalculate(panel) {
  const inputs = foodInputs(panel);
  if (inputs.length < 7) return;

  const food = findFood(inputs[0].value);
  if (!food) return;

  const quantity = inputs[1].value.trim();
  const match = quantity.match(
    /^(\d+(?:[.,]\d+)?)\s*(?:g|gramas)?$/i
  );

  if (!match) return;

  const grams = number(match[1]);
  if (grams <= 0) return;

  const result = window.lifeFoodLibrary
    .nutritionCalculate(food, grams);

  nutrients.forEach((key, i) => {
    inputs[i + 2].value = result[key];
  });
}

function updateMealTotals() {
  mealBoxes().forEach(meal => {
    let total = meal.querySelector(
      ":scope > .life46total"
    );

    if (!total) {
      total = document.createElement("div");
      total.className = "subpanel life46total";
      total.style.borderColor = "#c6a56d";
      meal.appendChild(total);
    }

    const sums = {
      calorias: 0,
      proteinas: 0,
      hidratos: 0,
      gorduras: 0
    };

    foodPanels(meal).forEach(panel => {
      const inputs = foodInputs(panel);
      if (inputs.length < 7) return;

      nutrients.forEach((key, i) => {
        sums[key] += number(inputs[i + 2].value);
      });
    });

    total.replaceChildren();

    const heading = document.createElement("b");
    heading.textContent = "Total da refeição";
    total.appendChild(heading);

    const p = document.createElement("p");
    p.textContent =
      round(sums.calorias) + " kcal · " +
      round(sums.proteinas) + " g proteína · " +
      round(sums.hidratos) + " g hidratos · " +
      round(sums.gorduras) + " g gordura";

    total.appendChild(p);
  });
}

/* Alterações manuais de quantidades */
area.addEventListener("input", event => {
  const input = event.target;
  if (!(input instanceof HTMLInputElement)) return;

  const panel = input.closest(".subpanel");
  if (!panel) return;

  const meal = mealBoxes().find(m => m.contains(panel));
  if (!meal) return;

  const foodPanel = foodPanels(meal)
    .find(p => p.contains(input));

  if (!foodPanel) return;

  const inputs = foodInputs(foodPanel);

  if (input === inputs[1] || input === inputs[0]) {
    recalculate(foodPanel);

    /* Atualizar resumo diário existente */
    const calories = inputs[2];
    if (calories) {
      calories.dispatchEvent(
        new Event("input", {bubbles: false})
      );
    }
  }

  updateMealTotals();
});

/* Atualizar totais após adicionar/remover alimentos */
let scheduled = false;

const observer = new MutationObserver(() => {
  if (scheduled) return;
  scheduled = true;

  requestAnimationFrame(() => {
    scheduled = false;
    updateMealTotals();
  });
});

observer.observe(area, {
  childList: true,
  subtree: true
});

/* Atualizar versão */
const subtitle = document.querySelector("header small");
if (subtitle) {
  subtitle.textContent =
    "O teu centro de controlo pessoal · v4.6.1";
}

})();

function library() {
  clear();
  const a = $("formArea");
  const list = $("items");

  a.appendChild(el("h3","🥊 Biblioteca de exercícios"));
  btn(a,"← Voltar aos modelos",()=>models("modelosTreino"),
      "secondary");

    );

    const categories = [...new Set(

        const item = el("div");
        item.className = "item";

        const ac = actions(item);
        btn(ac,"Editar",()=>editExercise(x.id),"secondary");

          if(saveExercises(getExercises().filter(
            z=>z.id!==x.id

      });
      list.appendChild(details);

/* LIFE 2000 v4.7.1 — BACKUPS SEGUROS */
(function () {
"use strict";

const BACKUP_KEYS = [
  "agenda",
  "alunos",
  "treinos",
  "nutricao",
  "notas",
  "modelosTreino",
  "modelosAlimentares",
  "bibliotecaAlimentos",
  "bibliotecaExercicios"
];

settings = function () {
  clear();

  const area = $("formArea");
  area.appendChild(el("h3", "Cópias de segurança"));
  area.appendChild(el("p",
    "Os dados são guardados neste dispositivo. " +
    "Não existe sincronização automática."
  ));

  btn(area, "Exportar cópia JSON", () => {
    const backup = {
      app: "LIFE 2000",
      version: "4.7.1",
      exportedAt: new Date().toISOString(),
      data: {}
    };

    BACKUP_KEYS.forEach(key => {
      backup.data[key] = getData(key);
    });

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      {type: "application/json"}
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "life2000-backup.json";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });

  const file = field(
    area, "Importar cópia JSON", "", "file"
  );
  file.accept = ".json,application/json";

  btn(area, "Importar cópia de segurança", async () => {
    if (!file.files || !file.files[0]) {
      alert("Seleciona um ficheiro JSON.");
      return;
    }

    let backup;

    try {
      backup = JSON.parse(await file.files[0].text());
    } catch (error) {
      alert("Não foi possível ler o ficheiro.");
      return;
    }

    if (
      backup.app !== "LIFE 2000" ||
      !backup.data ||
      typeof backup.data !== "object" ||
      Array.isArray(backup.data)
    ) {
      alert("Esta cópia não pertence ao LIFE 2000.");
      return;
    }

    const suppliedKeys = Object.keys(backup.data);

    if (
      !suppliedKeys.length ||
      suppliedKeys.some(key =>
        !BACKUP_KEYS.includes(key) ||
        !Array.isArray(backup.data[key])
      )
    ) {
      alert("A cópia contém dados incompatíveis.");
      return;
    }

    const message =
      "A cópia contém " + suppliedKeys.length +
      " categorias de dados.\n\n" +
      "As categorias presentes serão substituídas. " +
      "As categorias ausentes serão preservadas.\n\n" +
      "Queres continuar?";

    if (!confirm(message)) return;

    const previous = {};

    BACKUP_KEYS.forEach(key => {
      previous[key] = localStorage.getItem(
        "life2000_" + key
      );
    });

    try {
      suppliedKeys.forEach(key => {
        localStorage.setItem(
          "life2000_" + key,
          JSON.stringify(backup.data[key])
        );
      });
    } catch (error) {
      BACKUP_KEYS.forEach(key => {
        try {
          const old = previous[key];
          if (old === null) {
            localStorage.removeItem("life2000_" + key);
          } else {
            localStorage.setItem("life2000_" + key, old);
          }
        } catch (restoreError) {}
      });

      alert(
        "Erro ao importar. Verifica os dados " +
        "antes de voltar a tentar."
      );
      return;
    }

    alert("Cópia importada com sucesso.");
    show("home");
  });

  area.appendChild(el("p",
    "Guarda sempre uma cópia antes de importar. " +
    "A importação substitui os dados das categorias " +
    "presentes no ficheiro."
  ));
};

if (subtitle) {
  subtitle.textContent =
    "O teu centro de controlo pessoal · v4.7.1";
}

})();

function iso(d){
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fromISO(s){
 const [y,m,d]=s.split('-').map(Number);
 return new Date(y,m-1,d);
}
function addDays(d,n){
 const r=new Date(d);
 r.setDate(r.getDate()+n);
 return r;
}
function monday(d){
 const r=new Date(d);
 r.setDate(r.getDate()-(r.getDay()+6)%7);
 return r;
}

function occurrences(event,start,end){
 const base=fromISO(event.date);
 const out=[];
 const repeat=event.repeat||'none';
 let until=event.until?fromISO(event.until):addDays(base,366*3);
 if(until>end)until=end;
 if(base>end)return out;
 if(repeat==='none'){
  if(base>=start&&base<=end)out.push({...event,on:event.date});
  return out;
 }
 if(repeat==='weekly'||repeat==='biweekly'){
  let d=new Date(base);
  const step=repeat==='weekly'?7:14;
  if(d<start){
   const diff=Math.floor((start-d)/86400000);
   d=addDays(d,Math.max(0,Math.floor(diff/step))*step);
  }
  while(d<=until){
   if(d>=start)out.push({...event,on:iso(d)});
   d=addDays(d,step);
  }
 }else if(repeat==='daily'){
  let d=base<start?start:base;
  while(d<=until){
   out.push({...event,on:iso(d)});
   d=addDays(d,1);
  }
 }else if(repeat==='monthly'){
  let i=0;
  while(i<120){
   const d=new Date(base.getFullYear(),base.getMonth()+i,base.getDate());
   if(d.getDate()!==base.getDate()){i++;continue;}
   if(d>until)break;
   if(d>=start)out.push({...event,on:iso(d)});
   i++;
  }
 }
 return out;
}

  e.duration?e.duration+' min':'',
  e.studentId?studentName51(e.studentId):''
 ].filter(Boolean).join(' · ');
 box.appendChild(el('p',details));
 if(e.detail)box.appendChild(el('p',e.detail));
 parent.appendChild(box);
}
function upcoming51(studentId,query,days=365){
 const result=[];
 const today=new Date();
 today.setHours(0,0,0,0);
 for(let i=0;i<days;i++){
  const day=iso51(add51(today,i));
  appointments51(day).forEach(e=>{
   if(studentId&&e.studentId!==studentId)return;
   if(query&&![
    e.title,e.detail,studentName51(e.studentId)
   ].join(' ').toLowerCase().includes(query))return;
   result.push({event:e,day});
  });
 }
 return result;
}
function install51(){
 if(current!=='agenda')return;
 const area=$('formArea');
 if(!area)return;
 if(![...area.querySelectorAll('button')]
   .some(b=>b.textContent.trim()==='+ Nova marcação'))return;
 if(area.querySelector('#zeroAgendaPro51'))return;

 const panel=el('div');
 panel.id='zeroAgendaPro51';
 panel.className='subpanel';
 panel.appendChild(el('h3','🔎 Pesquisa e agenda diária'));

 const students=getData('alunos');
 panel.appendChild(el('label','Filtrar por aluno'));
 const select=el('select');
 const empty=el('option','Todos os alunos');
 empty.value='';
 select.appendChild(empty);
 students.slice().sort((a,b)=>
  a.nome.localeCompare(b.nome,'pt')
 ).forEach(s=>{
  const option=el('option',s.nome);
  option.value=s.id;
  select.appendChild(option);
 });
 panel.appendChild(select);

 const search=field(panel,'Pesquisar marcação');
 search.placeholder='Nome, título ou observações';

 const controls=actions(panel);
 const results=el('div');
 panel.appendChild(results);

 function render(){
  results.replaceChildren();
  const matches=upcoming51(
   select.value,
   search.value.trim().toLowerCase()
  );
  const title=el('p',
   matches.length+' marcações encontradas nos próximos 365 dias'
  );
  results.appendChild(title);

  if(!matches.length){
   results.appendChild(el('p','Nenhuma marcação encontrada.'));
   return;
  }

  let limit=10;
  const content=el('div');
  results.appendChild(content);

  function draw(){
   content.replaceChildren();
   matches.slice(0,limit).forEach(x=>
    eventCard51(content,x.event,x.day)
   );
  }
  draw();

  if(matches.length>10){
   const more=btn(results,'Mostrar mais',()=>{
    limit+=20;
    draw();
    if(limit>=matches.length)more.remove();
   },'secondary');
  }
 }

 btn(controls,'Pesquisar',render,'secondary');
 btn(controls,'Limpar filtros',()=>{
  select.value='';
  search.value='';
  results.replaceChildren();
 },'secondary');
 btn(controls,'Compromissos de hoje',()=>{
  results.replaceChildren();
  const today=iso51(new Date());
  const events=appointments51(today)
   .filter(e=>!select.value||e.studentId===select.value);
  results.appendChild(el('h3','Hoje — '+format51(today)));
  if(!events.length){
   results.appendChild(el('p','Sem compromissos para hoje.'));
  }
  events.forEach(e=>eventCard51(results,e,today));
 },'secondary');

 select.onchange=render;
 search.onkeydown=e=>{
  if(e.key==='Enter')render();
 };

 const toolbar=area.firstElementChild;
 if(toolbar)toolbar.after(panel);
 else area.appendChild(panel);
}

/* Aviso de conflitos antes de guardar */
let editing51=null;

area51.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;

 const text=button.textContent.trim();

 if(text==='Editar'&&current==='agenda'){
  const card=button.closest('.subpanel');
  const heading=card?.querySelector('b')?.textContent||'';
  const events=getData(KEY51);
  const match=events.find(e=>
   heading.includes(e.title)&&heading.startsWith(e.time+' ·')
  );
  editing51=match?.id||null;
 }

 if(text==='+ Nova marcação'){
  editing51=null;
 }

 if(text!=='Guardar marcação'||current!=='agenda')return;

 const fields=[...area51.querySelectorAll('input')];
 const title=fields.find(x=>x.type==='text')?.value.trim()||'';
 const day=fields.find(x=>x.type==='date')?.value;
 const time=fields.find(x=>x.type==='time')?.value;
 const duration=Number(fields.find(x=>x.type==='number')?.value);

 if(!title||!day||!time||
    !Number.isFinite(duration)||duration<=0)return;

 const start=minutes51(time),end=start+duration;
 const repeat=area51.querySelector('select');
 const repeated=repeat?
  [...area51.querySelectorAll('select')]
   .find(s=>[...s.options].some(o=>o.value==='weekly')):null;
 const until=fields.filter(x=>x.type==='date')[1]?.value||'';

 const candidate={
  date:day,time,duration,
  repeat:repeated?.value||'none',
  until
 };

 const horizon=candidate.repeat==='none'?1:365;
 const conflicts=[];
 const startDate=date51(day);

 for(let i=0;i<horizon;i++){
  const occurrence=iso51(add51(startDate,i));
  if(!active51(candidate,occurrence))continue;

  appointments51(occurrence).forEach(e=>{
   if(editing51&&e.id===editing51)return;
   const otherStart=minutes51(e.time);
   const otherEnd=otherStart+Number(e.duration||60);
   if(start<otherEnd&&end>otherStart){
    conflicts.push({
     day:occurrence,
     event:e
    });
   }
  });
  if(conflicts.length>=3)break;
 }

 if(!conflicts.length){
  editing51=null;
  return;
 }

 const details=conflicts.map(c=>
  format51(c.day)+' às '+c.event.time+
  ' — '+c.event.title
 ).join('\n');

 const proceed=confirm(
  '⚠️ ATENÇÃO: HORÁRIOS SOBREPOSTOS\n\n'+
  'Encontrámos '+conflicts.length+
  ' conflito(s), entre os primeiros verificados:\n\n'+
  details+
  '\n\nQueres guardar a marcação na mesma?'
 );

 if(!proceed){
  event.preventDefault();
  event.stopImmediatePropagation();
 }else{
  editing51=null;
 }
},true);

/* Melhorar contador da página inicial */
stats=function(){
 previousStats51();
 const old=getData('agenda').length;
 const modern=getData(KEY51).length;
 $('totalAgenda').textContent=old+modern;
};

/* Integrar na Agenda sem apagar a v5.0 */
show=function(k){
 previousShow51(k);
 if(k==='agenda'){
  editing51=null;
  install51();
 }
};

/* Reinserir filtros após mudar de dia ou mês */
let scheduled51=false;
new MutationObserver(()=>{
 if(scheduled51||current!=='agenda')return;
 scheduled51=true;
 requestAnimationFrame(()=>{
  scheduled51=false;
  install51();
 });
}).observe(area51,{childList:true,subtree:true});

const subtitle51=document.querySelector('header small');
if(subtitle51){
 subtitle51.textContent=
  'O teu centro de controlo pessoal · v5.1';
}
stats();
})();

</script>
