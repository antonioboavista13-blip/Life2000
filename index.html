
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>LIFE 2000</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:25px 20px;background:#191f2b;border-bottom:1px solid #303747}
h1{margin:0;color:#d9b77c;font-size:27px;letter-spacing:2px}
small,.muted{color:#a7adba}
main{padding:20px;max-width:850px;margin:auto;padding-bottom:110px}
h2{font-size:21px;color:#e3c18a}
h3{font-size:17px;color:#e3c18a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.panel{background:#1d2533;border:1px solid #30394a;border-radius:15px;padding:18px}
.card{cursor:pointer;min-height:115px}
.card b{display:block;margin:12px 0 5px;color:#e3c18a}
.card span{font-size:12px;color:#abb4c4}
.panel{margin-top:15px}
button{background:#c6a56d;color:#111827;border:0;border-radius:9px;padding:12px 15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
input,textarea,select{width:100%;background:#101722;border:1px solid #475064;color:white;padding:12px;border-radius:9px;margin:7px 0;font:inherit}
textarea{min-height:90px}
.item{border-bottom:1px solid #394253;padding:13px 0;overflow-wrap:anywhere}
.item:last-child{border:0}
.item b{color:#e3c18a}
.item p{white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{padding:9px 12px}
.secondary,.back{background:#313a4c;color:white}
.danger{background:#693b42;color:white}
.hidden{display:none!important}
nav{position:fixed;bottom:0;background:#191f2b;width:100%;display:flex;justify-content:space-around;padding:13px;border-top:1px solid #303747;z-index:10}
nav button{background:transparent;color:#d9b77c;padding:8px;font-size:13px}
.stats{display:flex;gap:10px;margin:15px 0}
.stat{flex:1;background:#1d2533;border-radius:12px;padding:15px;text-align:center}
.stat strong{display:block;color:#d9b77c;font-size:25px}
label{display:block;margin-top:10px;color:#cbd2dd;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header>
<h1>LIFE 2000</h1>
<small>O teu centro de controlo pessoal</small>
</header>
<main>
<section id="home">
<h2>O meu espaço</h2>
<div class="grid">
<div class="card" onclick="show('agenda')">📅<b>Agenda</b><span>Tarefas e compromissos</span></div>
<div class="card" onclick="show('alunos')">👥<b>Alunos</b><span>Fichas individuais</span></div>
<div class="card" onclick="show('treinos')">🥊<b>Treinos</b><span>Planos e exercícios</span></div>
<div class="card" onclick="show('nutricao')">🥗<b>Nutrição</b><span>Planos alimentares</span></div>
<div class="card" onclick="show('notas')">📝<b>Notas</b><span>Ideias e organização</span></div>
<div class="card" onclick="show('assistente')">✨<b>Assistente</b><span>Voz e texto — em preparação</span></div>
</div>
<div class="stats">
<div class="stat"><strong id="totalAlunos">0</strong><small>Alunos</small></div>
<div class="stat"><strong id="totalAgenda">0</strong><small>Compromissos</small></div>
</div>
</section>
<section id="editor" class="hidden">
<button class="back" onclick="show('home')">← Voltar</button>
<h2 id="sectionTitle"></h2>
<div id="formArea" class="panel"></div>
<div id="items" class="panel"></div>
</section>
</main>
<nav>
<button onclick="show('home')">⌂ Início</button>
<button onclick="show('agenda')">▦ Agenda</button>
<button onclick="show('alunos')">♙ Alunos</button>
<button onclick="show('notas')">✎ Notas</button>
</nav>
<script>
const names={
agenda:"Agenda",alunos:"Alunos",treinos:"Treinos",
nutricao:"Nutrição",notas:"Notas",assistente:"Assistente IA"
};
let current="home";
let selected=null;
let editing=null;
function getData(k){
try{return JSON.parse(localStorage.getItem("life2000_"+k))||[]}
catch{return []}
}
function saveData(k,v){
try{
localStorage.setItem("life2000_"+k,JSON.stringify(v));
return true;
}catch(e){
alert("Erro ao guardar os dados.");
return false;
}
}
function el(tag,text){
let e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
return e;
}
function addButton(parent,text,fn,cls=""){
let b=el("button",text);
b.className=cls;
b.onclick=fn;
parent.appendChild(b);
return b;
}
function updateStats(){
document.getElementById("totalAlunos").textContent=getData("alunos").length;
document.getElementById("totalAgenda").textContent=getData("agenda").length;
}
function show(k){
current=k;
selected=null;
editing=null;
document.getElementById("home").classList.toggle("hidden",k!=="home");
document.getElementById("editor").classList.toggle("hidden",k==="home");
updateStats();
if(k==="home")return;
document.getElementById("sectionTitle").textContent=names[k];
if(k==="alunos"){showStudents();return}
if(k==="assistente"){
document.getElementById("formArea").textContent="O assistente de voz e inteligência artificial será integrado numa próxima versão.";
document.getElementById("items").replaceChildren();
return;
}
showGeneric();
}
function showGeneric(){
let area=document.getElementById("formArea");
area.replaceChildren();
let title=el("input");
title.id="title";
title.placeholder=current==="agenda"?"Compromisso ou tarefa":"Título";
area.appendChild(title);
if(current==="agenda"){
let date=el("input");
date.type="datetime-local";
date.id="date";
area.appendChild(date);
}
let detail=el("textarea");
detail.id="detail";
detail.placeholder="Escreve aqui o conteúdo";
area.appendChild(detail);
addButton(area,"Guardar",addGeneric);
renderGeneric();
}
function addGeneric(){
let title=document.getElementById("title").value.trim();
let detail=document.getElementById("detail").value.trim();
let date=document.getElementById("date")?.value||"";
if(!title){alert("Preenche o título.");return}
let data=getData(current);
data.unshift({title,detail,date});
if(saveData(current,data))showGeneric();
updateStats();
}
function renderGeneric(){
let area=document.getElementById("items");
area.replaceChildren();
let data=getData(current);
if(!data.length){area.textContent="Ainda não existem registos.";return}
data.forEach((x,i)=>{
let div=el("div");
div.className="item";
div.appendChild(el("b",x.title));
if(x.date)div.appendChild(el("p",x.date.replace("T"," ")));
if(x.detail)div.appendChild(el("p",x.detail));
let actions=el("div");
actions.className="actions";
addButton(actions,"Editar",()=>{
document.getElementById("title").value=x.title;
document.getElementById("detail").value=x.detail||"";
if(document.getElementById("date"))
document.getElementById("date").value=x.date||"";
let old=area.dataset.edit;
area.dataset.edit=i;
let save=document.querySelector("#formArea button");
save.textContent="Guardar alterações";
save.onclick=()=>{
let d=getData(current);
d[i]={
title:document.getElementById("title").value.trim(),
detail:document.getElementById("detail").value.trim(),
date:document.getElementById("date")?.value||""
};
if(!d[i].title)return alert("Preenche o título.");
if(saveData(current,d))showGeneric();
};
},"secondary");
addButton(actions,"Eliminar",()=>{
if(!confirm("Eliminar este registo?"))return;
let d=getData(current);
d.splice(i,1);
if(saveData(current,d))showGeneric();
},"danger");
div.appendChild(actions);
area.appendChild(div);
});
}
function showStudents(){
let area=document.getElementById("formArea");
area.replaceChildren();
addButton(area,"+ Novo aluno",()=>studentForm());
let search=el("input");
search.placeholder="Pesquisar aluno pelo nome...";
search.oninput=()=>renderStudents(search.value);
area.appendChild(search);
renderStudents();
}
function renderStudents(filter=""){
let area=document.getElementById("items");
area.replaceChildren();
let data=getData("alunos").filter(x=>x.nome.toLowerCase().includes(filter.toLowerCase()));
if(!data.length){area.textContent="Nenhum aluno encontrado.";return}
data.forEach(x=>{
let div=el("div");
div.className="item";
div.appendChild(el("b",x.nome));
let info=[x.idade?x.idade+" anos":"",x.peso?x.peso+" kg":"",x.objetivo||""].filter(Boolean).join(" · ");
div.appendChild(el("p",info));
addButton(div,"Abrir ficha",()=>studentProfile(x.id));
area.appendChild(div);
});
}
function studentForm(id=null){
editing=id;
let data=getData("alunos");
let x=data.find(a=>a.id===id)||{};
let area=document.getElementById("formArea");
area.replaceChildren();
area.appendChild(el("h3",id?"Editar aluno":"Novo aluno"));
let fields=[
["nome","Nome do aluno","text"],
["idade","Idade","number"],
["altura","Altura (cm)","number"],
["peso","Peso (kg)","number"],
["objetivo","Objetivo principal","text"]
];
fields.forEach(([key,label,type])=>{
let l=el("label",label);
let input=el("input");
input.id="student_"+key;
input.type=type;
input.value=x[key]??"";
if(type==="number"){input.min="0";input.step=key==="peso"||key==="altura"?"0.1":"1"}
area.append(l,input);
});
let l=el("label","Observações");
let obs=el("textarea");
obs.id="student_obs";
obs.value=x.obs||"";
area.append(l,obs);
let actions=el("div");
actions.className="actions";
addButton(actions,"Guardar ficha",saveStudent);
addButton(actions,"Cancelar",()=>id?studentProfile(id):showStudents(),"secondary");
area.appendChild(actions);
document.getElementById("items").replaceChildren();
}
function saveStudent(){
let v={};
["nome","idade","altura","peso","objetivo"].forEach(k=>{
v[k]=document.getElementById("student_"+k).value.trim();
});
v.obs=document.getElementById("student_obs").value.trim();
if(!v.nome){alert("Preenche o nome.");return}
let data=getData("alunos");
if(editing){
let i=data.findIndex(a=>a.id===editing);
if(i<0)return;
data[i]={...data[i],...v};
}else{
v.id=String(Date.now())+Math.random().toString(36).slice(2);
v.planosTreino=[];
v.planosAlimentares=[];
data.unshift(v);
}
if(saveData("alunos",data)){
let id=editing||v.id;
editing=null;
studentProfile(id);
updateStats();
}
}
function studentProfile(id){
selected=id;
let x=getData("alunos").find(a=>a.id===id);
if(!x){showStudents();return}
let area=document.getElementById("formArea");
area.replaceChildren();
addButton(area,"← Lista de alunos",showStudents,"secondary");
area.appendChild(el("h2",x.nome));
let info=[
["Idade",x.idade?x.idade+" anos":"—"],
["Altura",x.altura?x.altura+" cm":"—"],
["Peso",x.peso?x.peso+" kg":"—"],
["Objetivo",x.objetivo||"—"],
["Observações",x.obs||"—"]
];
info.forEach(([label,value])=>{
let p=el("p");
p.appendChild(el("b",label+": "));
p.appendChild(document.createTextNode(value));
area.appendChild(p);
});
let actions=el("div");
actions.className="actions";
addButton(actions,"Editar ficha",()=>studentForm(id),"secondary");
addButton(actions,"Eliminar aluno",()=>deleteStudent(id),"danger");
area.appendChild(actions);
let items=document.getElementById("items");
items.replaceChildren();
["planosTreino","planosAlimentares"].forEach(type=>{
let box=el("div");
box.appendChild(el("h3",type==="planosTreino"?"🥊 Planos de treino":"🥗 Planos alimentares"));
addButton(box,"+ Criar plano",()=>planForm(id,type));
(x[type]||[]).forEach(p=>{
let div=el("div");
div.className="item";
div.appendChild(el("b",p.titulo));
div.appendChild(el("p",p.conteudo));
let a=el("div");
a.className="actions";
addButton(a,"Editar",()=>planForm(id,type,p.id),"secondary");
addButton(a,"Eliminar",()=>deletePlan(id,type,p.id),"danger");
div.appendChild(a);
box.appendChild(div);
});
items.appendChild(box);
});
}
function planForm(id,type,planId=null){
let x=getData("alunos").find(a=>a.id===id);
if(!x)return;
let p=(x[type]||[]).find(p=>p.id===planId)||{};
let area=document.getElementById("formArea");
area.replaceChildren();
area.appendChild(el("h3",planId?"Editar plano":"Criar plano"));
let title=el("input");
title.placeholder="Nome do plano";
title.value=p.titulo||"";
let content=el("textarea");
content.placeholder=type==="planosTreino"?
"Exercícios, séries, repetições, descanso...":
"Refeições, alimentos, quantidades, calorias...";
content.style.minHeight="220px";
content.value=p.conteudo||"";
area.append(title,content);
let actions=el("div");
actions.className="actions";
addButton(actions,"Guardar plano",()=>{
if(!title.value.trim())return alert("Preenche o nome do plano.");
let data=getData("alunos");
let aluno=data.find(a=>a.id===id);
if(!aluno)return;
aluno[type]=aluno[type]||[];
if(planId){
let old=aluno[type].find(a=>a.id===planId);
if(old){old.titulo=title.value.trim();old.conteudo=content.value.trim()}
}else{
aluno[type].push({
id:String(Date.now())+Math.random().toString(36).slice(2),
titulo:title.value.trim(),
conteudo:content.value.trim()
});
}
if(saveData("alunos",data))studentProfile(id);
});
addButton(actions,"Cancelar",()=>studentProfile(id),"secondary");
area.appendChild(actions);
document.getElementById("items").replaceChildren();
}
function deletePlan(id,type,planId){
if(!confirm("Eliminar este plano?"))return;
let data=getData("alunos");
let x=data.find(a=>a.id===id);
if(!x)return;
x[type]=(x[type]||[]).filter(p=>p.id!==planId);
if(saveData("alunos",data))studentProfile(id);
}
function deleteStudent(id){
if(!confirm("Eliminar o aluno e todos os seus planos?"))return;
let data=getData("alunos").filter(a=>a.id!==id);
if(saveData("alunos",data)){showStudents();updateStats()}
}
updateStats();
</script>
</body>
</html>
